<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" fill="none" role="img" aria-labelledby="dtd-title dtd-desc">
<title id="dtd-title">내부가 열린 아래 방향 T자 HVAC 덕트</title>
<desc id="dtd-desc">좌우와 아래쪽으로 연결되는 T자 덕트. 기존 수평 및 수직 덕트의 폭과 단면 명암을 유지하며 중앙 내부가 열려 있습니다. 배경은 투명합니다.</desc>
