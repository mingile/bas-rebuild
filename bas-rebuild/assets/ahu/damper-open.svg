<svg xmlns="http://www.w3.org/2000/svg" width="224" height="224" viewBox="0 0 224 224" fill="none" role="img" aria-labelledby="damper-open-title damper-open-desc">
  <title id="damper-open-title">HVAC 댐퍼 — 열림</title>
  <desc id="damper-open-desc">코일과 같은 224×224 크기와 우측 사선 구도의 금속 댐퍼. 좁은 앞면과 상단은 매끈한 금속이며 오른쪽 넓은 면에 다섯 장의 댐퍼 날개가 있습니다. 날개가 열려 어두운 내부 통로가 넓게 보입니다. 배경은 투명합니다.</desc>
