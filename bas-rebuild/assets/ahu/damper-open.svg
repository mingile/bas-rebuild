      <stop offset=".32" stop-color="#CDD7DE" />
      <stop offset=".7" stop-color="#A6B6C1" />
      <stop offset="1" stop-color="#718A9B" />
    </linearGradient>
    <linearGradient id="damper-open-bed" x1="0" y1="24" x2="0" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334A59" />
      <stop offset=".5" stop-color="#5B707F" />
      <stop offset="1" stop-color="#3B5465" />
    </linearGradient>
    <g id="damper-open-screw">
      <circle r="2" fill="#708999" stroke="#E3ECF2" stroke-width=".65" />
      <path d="M-1 0H1" stroke="#3C596C" stroke-width=".8" />
    </g>
