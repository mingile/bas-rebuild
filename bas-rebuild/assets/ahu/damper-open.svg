      <stop offset="1" stop-color="#B4C4D0" />
    </linearGradient>
    <linearGradient id="damper-open-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3EBF0" />
      <stop offset=".16" stop-color="#CFDAE2" />
